<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VaultDoc — Redact · Restore · Chat</title>
<meta name="description" content="VaultDoc pseudonymises confidential documents so teams can safely use AI, then restores real identities from locally-held mapping keys." />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fafafa'/%3E%3Cpath d='M16 5.5l8.5 3.5v7.2c0 5-3.8 8-8.5 9.8-4.7-1.8-8.5-4.8-8.5-9.8V9L16 5.5z' fill='none' stroke='%2309090b' stroke-width='2.2'/%3E%3Cpath d='M11.5 16.3l3.2 3.2 5.8-6.4' fill='none' stroke='%2309090b' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

<style>
/* =========================================================================
   VaultDoc — design system. Flat, high-contrast, Linear/Vercel discipline.
   No gradients, no glow, no glass: hairlines, solid fills, big padding.
   ========================================================================= */
:root{
  --bg:#09090b;               /* zinc-950 */
  --bg-soft:#0c0c0e;
  --panel:#0e0e11;
  --panel-hi:#121215;
  --raised:#18181b;           /* zinc-900 */
  --hover:#1f1f23;
  --line:#27272a;             /* zinc-800  */
  --line2:#3f3f46;            /* zinc-700  */
  --line3:#52525b;
  --text:#fafafa;
  --muted:#a1a1aa;
  --dim:#71717a;
  --ok:#10b981;
  --ok-soft:#6ee7b7;
  --warn:#fbbf24;
  --err:#fb7185;
  --r:10px; --r-lg:12px; --r-sm:7px;
  --side:232px;
  --depth:0 1px 2px rgba(0,0,0,.4);
  /* subdued category ink (legible on dark, no neon) */
  --c-person:#7dd3fc; --c-org:#a5b4fc; --c-money:#fcd34d; --c-email:#6ee7b7; --c-phone:#fda4af;
  --c-date:#bef264; --c-address:#93c5fd; --c-url:#fdba74; --c-id:#d4d4d8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4{font:600 1em/1.25 Inter,system-ui,sans-serif;letter-spacing:-.02em;margin:0}
.mono,code,kbd,pre{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,menlo,monospace}
::selection{background:rgba(16,185,129,.28);color:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
textarea{resize:none}
:focus-visible{outline:2px solid rgba(250,250,250,.35);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
[data-lucide]{width:1em;height:1em;stroke-width:1.8}

/* ── app frame ─────────────────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100vh;background:var(--bg)}
main{flex:1;min-height:0;overflow:hidden;width:100%}
.content{max-width:1160px;margin:0 auto;width:100%}

/* sidebar */
.side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg-soft);padding:14px 10px;gap:2px;z-index:10;min-width:0}
.side-brand{display:flex;align-items:center;gap:9px;padding:2px 8px 14px}
.side-logo{width:26px;height:26px;border-radius:7px;background:#fafafa;color:#09090b;display:grid;place-items:center;flex:none}
.side-logo i{width:14px;height:14px;stroke-width:2.2}
.side-name{font-weight:600;font-size:13px;letter-spacing:-.01em}
.side-ver{font-size:10px;color:var(--dim);margin-left:auto}
.side-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:12px 8px 5px}
.side-item{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:var(--r-sm);color:var(--muted);
  font-size:12.8px;font-weight:500;transition:background .12s,color .12s;text-align:left}
.side-item i{width:15px;height:15px;flex:none}
.side-item:hover{background:var(--raised);color:var(--text)}
.side-item.on{background:var(--raised);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.side-item [data-badge]{margin-left:auto}
.side-kbd{margin-left:auto;font-size:10px;color:var(--dim);font-family:"JetBrains Mono"}
.side-badge{margin-left:auto;min-width:17px;height:16px;padding:0 5px;border-radius:8px;background:var(--line2);color:var(--text);
  font-size:10px;font-weight:600;display:grid;place-items:center;font-family:"JetBrains Mono"}
.side-badge:empty{display:none}
.side-foot{margin-top:auto;padding:10px 8px 2px;border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim)}
.side-foot .dot{flex:none}

/* top bar */
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg-soft)}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.8px;min-width:0}
.crumb .sep{color:var(--line3)}
.crumb b{font-weight:600;color:var(--text)}
.crumb span{color:var(--dim)}
.topbar .spacer{flex:1}

/* ── surfaces ──────────────────────────────────────────────────────────── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.card-flat{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r)}
.card-hd{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-hd .ttl{font-weight:600;font-size:12.8px;color:var(--text)}
.card-hd i.hd{color:var(--dim);width:14px;height:14px}
.card-bd{padding:16px}
.hair{height:1px;background:var(--line)}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.sub{color:var(--muted);font-size:12.5px}
.mut{color:var(--muted)} .dim{color:var(--dim)}

/* ── buttons ───────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:500;
  border:1px solid var(--line2);background:var(--raised);color:var(--text);
  transition:background .12s,border-color .12s,color .12s;white-space:nowrap;user-select:none}
.btn i{width:14px;height:14px;flex:none}
.btn:hover{background:var(--hover);border-color:var(--line3)}
.btn:active{transform:translateY(.5px)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:#fafafa;border-color:#fafafa;color:#0a0a0a;font-weight:600}
.btn-primary:hover{background:#e4e4e7;border-color:#e4e4e7}
.btn-ok{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.1);color:var(--ok-soft)}
.btn-ok:hover{background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.55)}
.btn-danger{border-color:var(--line);background:transparent;color:var(--muted)}
.btn-danger:hover{color:#fda4af;border-color:rgba(251,113,133,.45);background:rgba(251,113,133,.08)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--raised);border-color:transparent;color:var(--text)}
.btn-sm{padding:5px 9px;font-size:11.5px;border-radius:7px;gap:5px}
.btn-sm i{width:13px;height:13px}
.btn-lg{padding:9px 16px;font-size:13px;border-radius:9px}

/* ── form controls ─────────────────────────────────────────────────────── */
.field{width:100%;background:var(--bg-soft);border:1px solid var(--line);border-radius:8px;padding:8px 11px;
  font-size:12.8px;color:var(--text);transition:border-color .12s,box-shadow .12s}
.field::placeholder{color:var(--dim)}
.field:focus{outline:none;border-color:var(--line3);box-shadow:0 0 0 3px rgba(250,250,250,.06)}
textarea.field{line-height:1.7}
.kbd{padding:2px 6px;border-radius:5px;border:1px solid var(--line2);background:var(--raised);font-size:10px;color:var(--muted);font-family:"JetBrains Mono"}
input[type=range]{height:3px;border-radius:99px;background:var(--line2);appearance:none;outline:none;width:100%}
input[type=range]::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;background:#fafafa;border:3px solid var(--line2);cursor:pointer}

.switch{width:36px;height:20px;border-radius:99px;border:1px solid var(--line2);background:var(--raised);position:relative;flex:none;cursor:pointer;transition:background .18s,border-color .18s;display:inline-block}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:transform .18s,background .18s}
.switch.on{background:var(--ok);border-color:var(--ok)}
.switch.on::after{transform:translateX(16px);background:#fff}
.switch-lg{width:42px;height:23px}
.switch-lg::after{width:17px;height:17px}
.switch-lg.on::after{transform:translateX(19px)}

/* ── pills / status ────────────────────────────────────────────────────── */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:500;
  border:1px solid var(--line2);background:var(--raised);color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.warn{background:var(--warn)}
.dot.err{background:var(--err)}
.dot.off{background:var(--dim)}
.dot.live{box-shadow:0 0 0 3px rgba(16,185,129,.18)}

/* ── privacy tokens ────────────────────────────────────────────────────── */
.tok{display:inline-flex;align-items:center;gap:5px;padding:1px 6px;border-radius:6px;font-family:"JetBrains Mono";
  font-size:.88em;font-weight:500;white-space:nowrap;cursor:default;transition:background .12s,border-color .12s;
  border:1px solid var(--tc,rgba(212,212,216,.28));background:var(--tb,rgba(212,212,216,.07));color:var(--tt,#d4d4d8)}
.tok i{width:11px;height:11px;opacity:.8}
.tok:hover{background:var(--th,rgba(212,212,216,.14))}
.tok.dim{opacity:.22}
.tok-hit{animation:tokIn .25s ease-out both}
@keyframes tokIn{from{opacity:0}to{opacity:1}}
[data-c="PERSON"]{--tc:rgba(125,211,252,.35);--tb:rgba(125,211,252,.08);--tt:var(--c-person);--th:rgba(125,211,252,.15)}
[data-c="ORGANIZATION"]{--tc:rgba(165,180,252,.35);--tb:rgba(165,180,252,.08);--tt:var(--c-org);--th:rgba(165,180,252,.15)}
[data-c="MONEY"]{--tc:rgba(252,211,77,.32);--tb:rgba(252,211,77,.08);--tt:var(--c-money);--th:rgba(252,211,77,.15)}
[data-c="EMAIL"]{--tc:rgba(110,231,183,.32);--tb:rgba(110,231,183,.08);--tt:var(--c-email);--th:rgba(110,231,183,.15)}
[data-c="PHONE"]{--tc:rgba(253,164,175,.32);--tb:rgba(253,164,175,.08);--tt:var(--c-phone);--th:rgba(253,164,175,.15)}
[data-c="DATE"]{--tc:rgba(190,242,100,.3);--tb:rgba(190,242,100,.07);--tt:var(--c-date);--th:rgba(190,242,100,.13)}
[data-c="ADDRESS"]{--tc:rgba(147,197,253,.32);--tb:rgba(147,197,253,.08);--tt:var(--c-address);--th:rgba(147,197,253,.15)}
[data-c="URL"]{--tc:rgba(253,186,116,.32);--tb:rgba(253,186,116,.08);--tt:var(--c-url);--th:rgba(253,186,116,.15)}
[data-c="ID"]{--tc:rgba(212,212,216,.26);--tb:rgba(212,212,216,.06);--tt:var(--c-id);--th:rgba(212,212,216,.12)}
.tok-unresolved{border-style:dashed;--tc:rgba(251,191,36,.45);--tb:rgba(251,191,36,.07);--tt:var(--warn);--th:rgba(251,191,36,.13)}
.restored{padding:1px 5px;border-radius:5px;background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.42);color:#c8f5e3;font-weight:500}
.restoring{animation:restIn .35s ease-out}
@keyframes restIn{from{opacity:.2}to{opacity:1}}
.on-hit{box-shadow:0 0 0 2px rgba(250,250,250,.35)}

/* redacted markers in the source pane */
.red{border-radius:5px;padding:1px 5px;font-weight:500;background:rgba(250,250,250,.05);box-shadow:inset 0 0 0 1px var(--line2)}
.red[data-c]{background:var(--tb);box-shadow:inset 0 0 0 1px var(--tc)}
.masked .red{color:transparent;text-shadow:0 0 9px rgba(228,228,231,.7);filter:blur(3.5px);transition:filter .2s,text-shadow .2s}
.masked .red:hover{filter:blur(1px);color:var(--muted)}
.revealed .red{color:var(--text);text-shadow:none;filter:none;background:rgba(251,191,36,.1);box-shadow:inset 0 0 0 1px rgba(251,191,36,.4)}

/* ── dropzone ──────────────────────────────────────────────────────────── */
.dz{border:1.5px dashed var(--line2);border-radius:var(--r-lg);background:var(--panel);
  transition:border-color .15s,background .15s}
.dz:hover{border-color:var(--line3);background:var(--panel-hi)}
.dz.over{border-color:var(--ok);background:rgba(16,185,129,.05)}
.dz-ic{width:40px;height:40px;border-radius:10px;background:var(--raised);border:1px solid var(--line2);
  display:grid;place-items:center;color:var(--muted);flex:none}
.dz-ic i{width:18px;height:18px}

/* ── busy pipeline ─────────────────────────────────────────────────────── */
.step{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg-soft);color:var(--dim);transition:border-color .15s,background .15s,color .15s}
.step .num{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:600;background:var(--raised);border:1px solid var(--line2);flex:none;font-family:"JetBrains Mono"}
.step.active{color:var(--text);border-color:var(--line3);background:var(--raised)}
.step.done{color:var(--ok-soft);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.06)}
.step.done .num{color:var(--ok-soft);border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.12)}
.bar{height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:#fafafa;transition:width .4s ease}

/* ── stats ─────────────────────────────────────────────────────────────── */
.stat{padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel)}
.stat .v{font-weight:600;font-size:22px;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.stat:hover{background:var(--panel-hi)}

/* chips / segmented control */
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:7px;font-size:11.5px;font-weight:500;
  border:1px solid var(--line2);background:transparent;color:var(--muted);transition:background .12s,color .12s,border-color .12s;cursor:pointer}
.chip:hover{color:var(--text);background:var(--raised);border-color:var(--line3)}
.chip.on{color:var(--text);border-color:var(--tt,#52525b);background:color-mix(in srgb,var(--tt,#52525b) 12%,transparent)}
.chip .cnt{font-family:"JetBrains Mono";font-size:10px;padding:1px 5px;border-radius:4px;background:var(--raised);color:var(--text)}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:9px;border:1px solid var(--line);background:var(--bg-soft)}
.seg button{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:500;color:var(--dim);transition:background .12s,color .12s;display:inline-flex;align-items:center;gap:6px}
.seg button i{width:13px;height:13px}
.seg button:hover{color:var(--muted)}
.seg button.on{background:var(--raised);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}

/* ── panes (mono + generous padding) ───────────────────────────────────── */
.pane{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.pane-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.pane-hd .txt{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.pane-bd{padding:18px 20px;font-size:12.6px;line-height:1.9;white-space:pre-wrap;word-break:break-word;overflow-y:auto;max-height:440px;color:#c9c9cf}
.pane-bd.doc{font-family:"JetBrains Mono";font-size:12px;line-height:2;color:#b8b8c0}
.lock-veil{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:rgba(9,9,11,.72);backdrop-filter:blur(7px);z-index:30;transition:opacity .18s,visibility .18s}
.lock-veil.hide{opacity:0;visibility:hidden}
.lock-veil .box{max-width:340px}

/* ── table ─────────────────────────────────────────────────────────────── */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.2px}
.tbl th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600;
  padding:9px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tbl td{padding:9px 14px;border-bottom:1px solid rgba(39,39,42,.6);color:var(--muted);vertical-align:middle}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:var(--panel-hi)}
.tbl tbody tr:hover td{color:var(--text)}

/* ── chat ──────────────────────────────────────────────────────────────── */
.bubble{padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.75;border:1px solid var(--line)}
.bubble.user{background:var(--raised);border-color:var(--line2);margin-left:auto;border-bottom-right-radius:4px;max-width:82%}
.bubble.ai{background:var(--bg-soft);border-bottom-left-radius:4px;flex:1}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.msg-body p{margin:4px 0}
.msg-body b{font-weight:600}
.ava{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;border:1px solid rgba(16,185,129,.35);background:rgba(16,185,129,.08);color:var(--ok-soft);margin-top:2px}
.ava i{width:13px;height:13px}
.model-card{padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;text-align:left;transition:border-color .12s,background .12s;width:100%}
.model-card:hover{background:var(--raised);border-color:var(--line2)}
.model-card.on{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.07)}

/* code-block */
.code-block{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  font-family:"JetBrains Mono";font-size:11.3px;line-height:1.8;color:var(--muted);white-space:pre-wrap;word-break:break-word}

/* ── views & transitions (instant, no staged slide-ins) ────────────────── */
.view{display:none;height:100%;overflow-y:auto;overscroll-behavior:contain}
.view.on{display:block;animation:viewIn .12s ease-out}
@keyframes viewIn{from{opacity:.4}to{opacity:1}}

/* ── overlays (strict z-index scale) ───────────────────────────────────── */
/* base 0 · sidebar/topbar 10-20 · in-card veils 30 · scrims 40 · drawer 50 · modal 60 · cmdk 70 · toasts 100 */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s}
.overlay.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);z-index:50;background:var(--bg-soft);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.modal{position:fixed;z-index:60;left:50%;top:50%;width:min(560px,94vw);translate:-50% -50%;opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s}
.modal.on{opacity:1;visibility:visible}
.cmdk{position:fixed;z-index:70;left:50%;top:14vh;translate:-50% 0;width:min(580px,94vw);opacity:0;visibility:hidden;transition:opacity .16s,visibility .16s,translate .16s;transform:translateY(-6px)}
.cmdk.on{opacity:1;visibility:visible;transform:none}
.cmd-row{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:7px;cursor:pointer;color:var(--muted);transition:background .1s,color .1s;font-size:12.8px}
.cmd-row.sel,.cmd-row:hover{background:var(--raised);color:var(--text)}

/* toasts — fixed stack, above everything, never under panels */
#toasts{position:fixed;z-index:100;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:9px;min-width:250px;max-width:380px;pointer-events:auto;
  background:var(--panel-hi);border:1px solid var(--line2);box-shadow:var(--depth),0 12px 32px -12px rgba(0,0,0,.7);
  animation:toastIn .22s ease-out both;font-size:12.5px}
.toast.out{animation:toastOut .18s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
.toast .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;background:rgba(16,185,129,.12);color:var(--ok-soft)}
.toast .ic i{width:12px;height:12px}

/* scrollbars */
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--line3);background-clip:padding-box}

/* misc */
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flash-in{animation:viewIn .15s ease-out both}
.txt-err{color:var(--err);font-weight:600}
.txt-ok{color:var(--ok-soft)}
.link-btn{color:var(--muted);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.link-btn:hover{color:var(--text)}

/* ── calm workspace layout ─────────────────────────────────────────────── */
.main-column{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.redact-work{display:none}
.redact-work.active{display:block}
.empty-page{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:48px 28px 64px;max-width:900px;margin:0 auto}
.empty-heading{font-size:26px;font-weight:600;letter-spacing:-.035em}
.empty-copy{font-size:13px;color:var(--muted);margin-top:8px;max-width:54ch;line-height:1.7}
.drop-main{margin-top:28px;min-height:230px;display:flex;align-items:center;justify-content:center;padding:36px}
.drop-content{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:520px}
.drop-content .dz-ic{width:44px;height:44px;margin-bottom:17px}
.drop-content h2{font-size:15px;font-weight:600}
.drop-content p{font-size:12px;color:var(--dim);margin-top:6px}
.result-head{display:flex;align-items:center;gap:14px;padding:17px 20px;margin-bottom:16px}
.result-head .doc-mark{width:34px;height:34px;border:1px solid var(--line2);border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.result-head .doc-mark i{width:16px;height:16px}
.result-card{overflow:hidden}
.result-title{font-size:13.5px;font-weight:600}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.result-grid>.pane{border:0;border-radius:0;min-width:0}
.result-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.keys-details{margin-top:14px;overflow:hidden}
.keys-details>summary{display:flex;align-items:center;gap:10px;list-style:none;cursor:pointer;padding:16px 18px;color:var(--text);font-weight:600;font-size:12.8px}
.keys-details>summary::-webkit-details-marker{display:none}
.keys-details>summary:hover{background:var(--panel-hi)}
.keys-details>summary .summary-count{font:11px "JetBrains Mono";font-weight:400;color:var(--dim);margin-left:2px}
.keys-details>summary .chev{margin-left:auto;color:var(--dim);transition:transform .16s}
.keys-details[open]>summary .chev{transform:rotate(180deg)}
.keys-body{border-top:1px solid var(--line)}
.restore-page{max-width:1240px}
.restore-layout{align-items:stretch}
.restore-panel{min-width:0;min-height:560px;display:flex;flex-direction:column}
.restore-panel .card-bd{flex:1;display:flex;flex-direction:column;gap:14px}
.restore-text{flex:1;min-height:350px}
.restore-output{min-height:450px}
.restore-output .pane-bd{min-height:380px;max-height:none}
.restore-foot{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.restore-status{font-size:11.5px;color:var(--dim);line-height:1.5}
.key-source-label{font-size:11.5px;color:var(--dim)}
.csv-compact{padding:13px 15px;text-align:left}
.csv-compact .csv-title{font-size:12px;font-weight:500}
.chat-page{height:100%;display:flex;flex-direction:column;max-width:1200px}
.chat-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;flex:none}
.chat-window{flex:1;min-height:360px;display:flex;flex-direction:column;overflow:hidden}
.chat-log{flex:1;min-height:0;overflow-y:auto;padding:24px clamp(18px,4vw,48px);align-content:start}
.chat-input-area{padding:14px 18px;background:var(--panel);border-top:1px solid var(--line)}
.advanced{position:relative;flex:none}
.advanced>summary{display:inline-flex;align-items:center;gap:7px;list-style:none;cursor:pointer;padding:8px 11px;border:1px solid var(--line2);border-radius:8px;color:var(--muted);font-size:11.8px;background:var(--bg-soft)}
.advanced>summary::-webkit-details-marker{display:none}
.advanced>summary:hover{color:var(--text);background:var(--raised)}
.advanced[open]>summary{color:var(--text);border-color:var(--line3)}
.advanced-panel{margin-top:10px;padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:grid;gap:14px}
.advanced-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.advanced-group{min-width:0;padding:13px;border:1px solid var(--line);border-radius:8px;background:var(--bg-soft)}
.advanced-group h3{font-size:11.5px;font-weight:600;margin-bottom:10px}
.advanced-full{grid-column:1/-1}
.advanced-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.restore-result-actions{display:flex;align-items:center;gap:6px}
.restore-result-actions .hidden{display:none!important}
.view.on{animation:none}

@media (max-width:1100px){:root{--side:64px}.side .side-name,.side .side-ver,.side .side-kbd,.side-label,.side-foot .txt{display:none}.side-item{justify-content:center;padding:8px}.side-item>span:not(.side-badge){display:none}.side-item i{margin:0}.side-badge{position:absolute;top:2px;right:2px}}
@media (max-width:900px){.result-grid{grid-template-columns:1fr}.restore-panel{min-height:0}.restore-text{min-height:260px}.restore-output{min-height:340px}.restore-output .pane-bd{min-height:260px}}
@media (max-width:760px){
  .shell{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 58px}
  .main-column{grid-row:1}
  .side{grid-row:2;flex-direction:row;justify-content:space-around;align-items:stretch;border:0;border-top:1px solid var(--line);padding:5px 8px;gap:5px}
  .side-brand,.side-label,.side-foot{display:none}
  .side-item{position:relative;flex:1;flex-direction:column;justify-content:center;gap:3px;padding:4px 2px;font-size:10px}
  .side-item span:not(.side-badge){display:inline!important;font-size:10px}
  .side-item i{width:16px;height:16px}
  .side-badge{position:absolute;top:1px;right:calc(50% - 18px)}
  .topbar{padding:0 14px}
  .topbar .cmd-trigger{display:none}
  .content{padding:20px 16px!important}
  .empty-page{padding:36px 18px}
  .drop-main{padding:28px 18px;min-height:210px}
  .result-head{padding:14px;align-items:flex-start}
  .result-head .actions{width:100%;justify-content:flex-start}
  .restore-layout{grid-template-columns:1fr!important}
  .restore-panel{min-height:0}
  .restore-text{min-height:230px}
  .chat-page{padding:18px 14px!important}
  .chat-window{min-height:calc(100dvh - 160px)}
  .advanced[open] .advanced-panel{max-height:55vh;overflow:auto}
  .advanced-grid{grid-template-columns:1fr}
  .advanced-full{grid-column:auto}
  #toasts{right:10px;bottom:68px;left:10px;align-items:stretch}
  .toast{min-width:0;max-width:none}
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.01s!important}}
</style>
